<div class="container">
    @if (product.discountPercentage != 0) {
        <div class="discount-badge">
            -{{(product.discountPercentage/100) |
            percent}}
        </div>
    }
    <div class="product-card" [class.product-card--clickable]="clickable">
        <div class="product-card__img-wrapper">
            <img class="product-card__img" src="{{product.image}}">
        </div>
        <div class = "product-card__right-container">
            <div class="product-card__text-block">
                <p class="product-card__name">{{product.name}}</p>
                <p class="product-card__ingredients">{{ingredients}}</p>
            </div>
            <div class="product-card__prices">
                @if (product.discountPercentage != 0) {
                <div class="product-card__price product-card__price--base">{{product.basePrice | currency}}</div>
                }
                <div class="product-card__price product-card__price--final">{{product.finalPrice | currency}}</div>
            </div>
        </div> 
    </div>
</div>
