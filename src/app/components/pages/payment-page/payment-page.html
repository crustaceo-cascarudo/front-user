<div class="payment-page">
  <div class="payment-page__container">
    <h1 class="payment-page__title">Datos de Pago</h1>
    
    <form 
      class="payment-page__form" 
      (ngSubmit)="onSubmit(paymentForm)" 
      #paymentForm="ngForm"
      [class.payment-page__form--loading]="isLoading"
    >
      <div class="payment-page__form-group">
        <label for="cardNumber" class="payment-page__form-label">
          Número de Tarjeta *
        </label>
        <input 
          #cardNumberInput="ngModel"
          required 
          [(ngModel)]="paymentData.cardNumber" 
          type="text" 
          name="cardNumber"
          class="payment-page__form-control" 
          id="cardNumber"
          placeholder="1234 5678 9012 3456"
          maxlength="19"
        >
        <div 
          [hidden]="cardNumberInput.valid || cardNumberInput.pristine" 
          class="payment-page__form-error"
        >
          El número de tarjeta es requerido
        </div>    
      </div>

      <div class="payment-page__form-row">
        <div class="payment-page__form-group">
          <label for="expiryMonth" class="payment-page__form-label">
            Mes de Vencimiento *
          </label>
          <select 
            #expiryMonthInput="ngModel"
            required 
            [(ngModel)]="paymentData.expiryMonth" 
            name="expiryMonth"
            class="payment-page__form-control" 
            id="expiryMonth"
          >
            <option value="">Mes</option>
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          <div 
            [hidden]="expiryMonthInput.valid || expiryMonthInput.pristine" 
            class="payment-page__form-error"
          >
            Selecciona el mes
          </div>
        </div>

        <div class="payment-page__form-group">
          <label for="expiryYear" class="payment-page__form-label">
            Año de Vencimiento *
          </label>
          <select 
            #expiryYearInput="ngModel"
            required 
            [(ngModel)]="paymentData.expiryYear" 
            name="expiryYear"
            class="payment-page__form-control" 
            id="expiryYear"
          >
            <option value="">Año</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
          </select>
          <div 
            [hidden]="expiryYearInput.valid || expiryYearInput.pristine" 
            class="payment-page__form-error"
          >
            Selecciona el año
          </div>
        </div>
      </div>

      <div class="payment-page__form-group">
        <label for="cvc" class="payment-page__form-label">
          CVC *
        </label>
        <input 
          #cvcInput="ngModel"
          required 
          [(ngModel)]="paymentData.cvc" 
          type="text" 
          name="cvc"
          class="payment-page__form-control" 
          id="cvc"
          placeholder="123"
          maxlength="4"
        >
        <div 
          [hidden]="cvcInput.valid || cvcInput.pristine" 
          class="payment-page__form-error"
        >
          El código CVC es requerido
        </div>
      </div>

      <div class="payment-page__form-group">
        <label for="fullName" class="payment-page__form-label">
          Nombre Completo *
        </label>
        <input 
          #fullNameInput="ngModel"
          required 
          [(ngModel)]="paymentData.fullName" 
          type="text" 
          name="fullName"
          class="payment-page__form-control" 
          id="fullName"
          placeholder="Juan Pérez García"
        >
        <div 
          [hidden]="fullNameInput.valid || fullNameInput.pristine" 
          class="payment-page__form-error"
        >
          El nombre completo es requerido
        </div>
      </div>

      <button 
        type="submit" 
        class="payment-page__submit-btn"
        [disabled]="!paymentForm.form.valid || isLoading"
      >
        <i class="fa-solid fa-credit-card" *ngIf="!isLoading"></i>
        <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
        {{ isLoading ? 'Procesando...' : 'Procesar Pago' }}
      </button>
    </form>
  </div>
</div>
