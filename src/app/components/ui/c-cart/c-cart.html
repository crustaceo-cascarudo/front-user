<div class="cart">
    <div class="cart__top-container">
        <p class="cart__title">Tu pedido</p>
    </div>
    <div class="cart__middle-container">
        <div class="cart__items-fade-top"></div>
        <div class="cart__items-container">
            @for (item of cartItems; track $index) {
            <cart-element (removeFromCart)="removeItem(item.id)" [cartItem]="item"></cart-element>
            }
        </div>
        <div class="cart__items-fade-bottom"></div>
    </div>
    <div class="cart__bottom-container">
        <p class="cart__total-price">Precio total: {{cartTotal |
            currency}}</p>
        <a routerLink="/payment" c-button colors="secondary" style="width: 100%; height: 3rem;">Terminar Pedido</a>
    </div>
</div>
