<div class="news-card">
    <img [src]="imageUrl" alt="News Image" class="news-card__image">
    <div class="news-card__content">
        <div class="news-card__text-block">
            <h2 class="news-card__title">{{ title }}</h2>
            <p class="news-card__description">{{ description }}</p>
        </div>
        <button c-button class="g--bg-colors-yellow-3 g--colors-dark">{{ buttonText }}</button>
    </div>

</div>
