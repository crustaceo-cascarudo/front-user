<div class="cart-item-card">
    <div class="cart-item-card__img-container">
        <img class="cart-item-card__img" src="{{cartItem.image}}">
    </div>
    <div class="cart-item-card__right-container">
        <div class="cart-item-card__text-block">
            <p class="cart-item-card__name">{{cartItem.name}}</p>
            <div class="cart-item-card__prices">
                <div class="cart-item-card__price cart-item-card__price--final">{{cartItem.subtotal | currency}}</div>
            </div>
        </div>
    </div>
    <div class="cart-item-card__buttons-container">
        @if(cartItem.quantity > 1){
            <button c-button (click)="decreaseQuantity()">−</button>
        }@else{
            <button c-button (click)="decreaseQuantity()">🗑</button>
        }
        <div>{{cartItem.quantity}}</div>
        <button c-button (click)="increaseQuantity()">+</button>
    </div>
</div>
