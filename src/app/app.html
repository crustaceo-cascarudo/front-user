<app-navbar></app-navbar>
<router-outlet />
<app-footer></app-footer>

@if(showChatBot){
<iframe
    style="height:600px; width:400px; position: fixed; top: 25%; right: 20px; z-index: 1000; border: none; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);"
    [src]="chatBotSanitizedUrl()"></iframe>
}

<button c-button colors="highlight" (click)="showChatBot = !showChatBot"
    style="position: fixed; bottom: 30px; right: 30px; z-index: 1001; padding: 20px 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
    <i [class]="showChatBot ? 'fa-solid fa-xmark' : 'fa-solid fa-robot'"></i>
    </button>
